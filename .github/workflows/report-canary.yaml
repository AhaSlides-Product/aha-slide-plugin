name: "Report App - Canary Deploy"

on:
  workflow_dispatch:
    inputs:
      report_branch:
        description: "Branch of aha-report submodule to deploy (leave empty to use default submodule commit)"
        required: false
        default: "staging"
  push:
    branches:
      - reports-canary

jobs:
  build:
    runs-on:
      group: github-runner-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Checkout report branch
        if: ${{ github.event.inputs.report_branch != '' }}
        shell: bash
        run: |
          cd domains/report
          git fetch origin ${{ github.event.inputs.report_branch }}
          git checkout ${{ github.event.inputs.report_branch }}

      - name: Build
        uses: ./.github/actions/build-report
        with:
          mode: canary

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy Report App
        uses: ./.github/actions/deploy-report
        with:
          s3_bucket: s3://presenter2.ahaslides.com/reports
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_region: us-east-1
          cloudfront_distribution_id: EE79QGD4ME02U
