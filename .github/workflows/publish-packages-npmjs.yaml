name: "Publish Packages (npmjs public)"

on:
  workflow_dispatch:

# Publishes the @aha/* SDK packages to public npm (registry.npmjs.org) under the
# @ahaslides-product scope. The local -> published name mapping and the
# rewrite/build/publish logic are shared with publish-packages.yaml via
# scripts/publish/*.

jobs:
  publish:
    runs-on: ubuntu-latest
    # Publishing goes to npmjs.org via NPM_TOKEN, so GITHUB_TOKEN only needs read.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@ahaslides-product'

      - name: Apply publish name map
        run: node scripts/publish/apply-name-map.mjs
        env:
          # Public npm: force publishConfig access=public + this registry.
          PUBLISH_REGISTRY: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Build mapped packages
        run: node scripts/publish/build-mapped.mjs

      - name: Publish mapped packages
        run: node scripts/publish/publish-mapped.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_ACCESS: public
