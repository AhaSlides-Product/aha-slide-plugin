name: "Publish Packages"

on:
  workflow_dispatch:

env:
  PACKAGE_NAME_MAP: |
    {
      "@aha/ui": "@ahaslides-product/plugins-ui",
      "@aha/ui-vanilla": "@ahaslides-product/plugins-ui-vanilla",
      "@aha/toolkit": "@ahaslides-product/plugins-toolkit",
      "@aha/design": "@ahaslides-product/plugins-design",
      "@aha/api": "@ahaslides-product/plugins-api",
      "@aha/db": "@ahaslides-product/plugins-db",
      "@aha/common": "@ahaslides-product/plugins-common"
    }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ahaslides-product'

      - name: Apply publish name map
        shell: bash
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const nameMap = JSON.parse(process.env.PACKAGE_NAME_MAP);

          // Expand workspace globs from root package.json without requiring npm install
          function expandWorkspaces(patterns) {
            const results = [];
            for (const pat of patterns) {
              const parts = pat.split('/');
              let candidates = [''];
              for (const part of parts) {
                const next = [];
                for (const c of candidates) {
                  if (part === '*') {
                    const dir = c || '.';
                    let entries = [];
                    try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch {}
                    for (const e of entries) {
                      if (e.isDirectory()) next.push(c ? path.join(c, e.name) : e.name);
                    }
                  } else {
                    next.push(c ? path.join(c, part) : part);
                  }
                }
                candidates = next;
              }
              results.push(...candidates);
            }
            return results.filter(p => {
              try { return fs.statSync(path.join(p, 'package.json')).isFile(); } catch { return false; }
            });
          }

          const rootPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const workspaceDirs = expandWorkspaces(rootPkg.workspaces || []);

          const infoByLocal = new Map();
          for (const dir of workspaceDirs) {
            const pkgPath = path.join(dir, 'package.json');
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            infoByLocal.set(pkg.name, { path: pkgPath, dir, pkg });
          }

          for (const local of Object.keys(nameMap)) {
            if (!infoByLocal.has(local)) {
              console.error('::error::Mapped package not found in workspaces: ' + local);
              process.exit(1);
            }
          }

          // 1. Rewrite package.json of each mapped package: name + any cross-mapped dep keys
          for (const local of Object.keys(nameMap)) {
            const info = infoByLocal.get(local);
            info.pkg.name = nameMap[local];
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              if (!info.pkg[field]) continue;
              for (const [depName, depVer] of Object.entries(info.pkg[field])) {
                if (nameMap[depName]) {
                  delete info.pkg[field][depName];
                  info.pkg[field][nameMap[depName]] = depVer;
                }
              }
            }
            fs.writeFileSync(info.path, JSON.stringify(info.pkg, null, 2) + '\n');
            console.log('Rewrote ' + info.path + ': ' + local + ' -> ' + nameMap[local]);
          }

          // 2. Rewrite source imports of each mapped package
          const SOURCE_EXTS = new Set(['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.vue']);
          const EXCLUDE_DIRS = new Set(['node_modules', 'dist', 'build', '.turbo', 'docs', '.git']);
          const escape = s => s.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
          const patterns = Object.entries(nameMap).map(([local, published]) => ({
            regex: new RegExp('([\'"`])' + escape(local) + '\\1', 'g'),
            replacement: '$1' + published + '$1',
            local,
          }));

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (EXCLUDE_DIRS.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                walk(full);
              } else if (SOURCE_EXTS.has(path.extname(entry.name))) {
                let content = fs.readFileSync(full, 'utf8');
                let changed = false;
                for (const { regex, replacement } of patterns) {
                  if (regex.test(content)) {
                    content = content.replace(regex, replacement);
                    changed = true;
                  }
                }
                if (changed) {
                  fs.writeFileSync(full, content);
                  console.log('Rewrote imports in ' + full);
                }
              }
            }
          }

          for (const local of Object.keys(nameMap)) {
            walk(infoByLocal.get(local).dir);
          }
          SCRIPT

      - name: Install dependencies
        run: npm install

      - name: Build mapped packages
        shell: bash
        run: |
          node <<'SCRIPT'
          const { execSync } = require('child_process');
          const nameMap = JSON.parse(process.env.PACKAGE_NAME_MAP);
          const filters = Object.values(nameMap).map(n => '--filter=' + n).join(' ');
          execSync('npx turbo run build ' + filters, { stdio: 'inherit' });
          SCRIPT

      - name: Publish mapped packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_AUTH_TOKEN secret is empty"
            exit 1
          fi
          node <<'SCRIPT'
          const { spawnSync } = require('child_process');
          const nameMap = JSON.parse(process.env.PACKAGE_NAME_MAP);
          const skipped = [];
          const failed = [];
          for (const published of Object.values(nameMap)) {
            console.log('::group::Publishing ' + published);
            const result = spawnSync('npm', ['publish', '-w', published], {
              encoding: 'utf8',
              stdio: ['inherit', 'pipe', 'pipe'],
            });
            if (result.stdout) process.stdout.write(result.stdout);
            if (result.stderr) process.stderr.write(result.stderr);
            console.log('::endgroup::');

            if (result.status === 0) continue;

            const combined = (result.stdout || '') + (result.stderr || '');
            const isConflict = /\b409\b/.test(combined)
              || /EPUBLISHCONFLICT/i.test(combined)
              || /cannot publish over the previously published versions/i.test(combined)
              || /You cannot publish over the previously published version/i.test(combined);

            if (isConflict) {
              console.log('::warning::' + published + ' already published at this version (409). Skipping.');
              skipped.push(published);
            } else {
              console.log('::error::' + published + ' failed to publish (exit ' + result.status + ')');
              failed.push(published);
            }
          }
          if (skipped.length) console.log('Skipped (already published): ' + skipped.join(', '));
          if (failed.length) {
            console.error('Failed to publish: ' + failed.join(', '));
            process.exit(1);
          }
          SCRIPT
