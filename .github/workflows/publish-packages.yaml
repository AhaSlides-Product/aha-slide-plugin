name: "Publish Packages"

on:
  workflow_dispatch:

# Publishes the @aha/* SDK packages to GitHub Packages under the @ahaslides-product
# scope. The local -> published name mapping and the rewrite/build/publish logic are
# shared with publish-packages-npmjs.yaml via scripts/publish/*.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ahaslides-product'

      - name: Apply publish name map
        run: node scripts/publish/apply-name-map.mjs

      - name: Install dependencies
        run: npm install

      - name: Build mapped packages
        run: node scripts/publish/build-mapped.mjs

      - name: Publish mapped packages
        run: node scripts/publish/publish-mapped.mjs
        env:
          # The built-in token, not a PAT. GitHub Packages lets a repository's
          # GITHUB_TOKEN publish any npm package LINKED to that repository, and
          # all of these now are — seven of them linked by hand after the
          # `repository` field landed, the rest auto-linking on first publish.
          # Before that they read NOT LINKED and only a PAT could publish them.
          #
          # This removes the `NPM_AUTH_TOKEN` secret from the critical path. It
          # went missing at some point between 2026-08-13 and 2026-09-14 and
          # took the workflow down with it; a token scoped to this run cannot
          # disappear or expire that way. `packages: write` above is what grants
          # it, and is already the minimum this job needs.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
