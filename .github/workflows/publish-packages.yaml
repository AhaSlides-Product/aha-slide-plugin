name: "Publish Packages"

on:
  workflow_dispatch:

# Publishes the @aha/* SDK packages to GitHub Packages under the @ahaslides-product
# scope. The local -> published name mapping and the rewrite/build/publish logic are
# shared with publish-packages-npmjs.yaml via scripts/publish/*.

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ahaslides-product'

      - name: Apply publish name map
        run: node scripts/publish/apply-name-map.mjs

      - name: Install dependencies
        run: npm install

      - name: Build mapped packages
        run: node scripts/publish/build-mapped.mjs

      - name: Publish mapped packages
        run: node scripts/publish/publish-mapped.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
