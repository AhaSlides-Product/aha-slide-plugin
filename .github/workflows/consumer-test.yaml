name: "Consumer Test"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: true
        default: "staging"
      environment:
        description: "Environment to test"
        required: true
        default: "staging"
        type: choice
        options:
          - staging

  workflow_run:
    workflows: ["Staging Deploy"]
    types:
      - completed

concurrency:
  group: consumer-test
  cancel-in-progress: false

jobs:
  consumer-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Wait for 5 minutes
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 300

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'staging' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run consumer tests
        run: npm run test:consumer

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: tests/test-results/vitest/junit-report.xml

      - name: Upload JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-report
          path: tests/test-results/vitest/json-report.json

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: tests/test-results/vitest/html-report

      - name: Extract Deployment Metadata
        id: extract-metadata
        uses: actions/github-script@v6
        env:
          EVENT_NAME: ${{ github.event_name }}
          # For workflow_run, use the head_sha of the triggering workflow run
          # For workflow_dispatch, use the sha of the current run
          LATEST_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          github-token: ${{ secrets.QA_ACCESS_TOKEN_FOR_DISPATCH }}
          script: |
            const sha = process.env.LATEST_SHA;
            const event = process.env.EVENT_NAME;

            let title = "Manual Trigger", link = "N/A", num = "N/A", deployer = context.actor;

            if (event === 'workflow_run') {
               try {
                 const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner: context.repo.owner, repo: context.repo.repo, commit_sha: sha
                 });
                 const pr = prs.find(p => p.merged_at) || prs[0];
                 
                 if (pr) {
                    title = pr.title; link = pr.html_url; num = pr.number; deployer = pr.user.login;
                 } else {
                    const { data: c } = await github.rest.repos.getCommit({
                      owner: context.repo.owner, repo: context.repo.repo, ref: sha
                    });
                    title = `Commit: ${(c.commit.message || "").split('\n')[0]}`;
                    link = c.html_url;
                    deployer = c.author?.login || c.committer?.login || c.commit.author.name;
                 }
               } catch (e) {
                 console.error(e);
                 title = "Error fetching metadata";
               }
            }

            core.setOutput("deployer", deployer);
            core.setOutput("pr_num", num);
            core.setOutput("pr_title", title);
            core.setOutput("pr_link", link);
          result-encoding: string

      - name: Install AWS CLI
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi
            $SUDO apt-get update -y && $SUDO apt-get install -y unzip
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            $SUDO ./aws/install
            rm -rf aws awscliv2.zip
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Upload Reports to S3
        id: s3-upload
        shell: bash
        run: |
          ENV="${{ github.event_name == 'workflow_run' && 'staging' || inputs.environment }}"
          RUN_ID="${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}"
          REPORTPATH=$(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d/%H%M')-$(basename ${{ github.repository }})-${ENV}-${RUN_ID}
          echo "url=https://testreport.staging.ahaslide.com/${REPORTPATH}/vitest/html-report/index.html" >> $GITHUB_OUTPUT
          aws s3 cp --recursive tests/test-results/ s3://testreport.staging.ahaslide.com/${REPORTPATH}/ --exclude "*.meta.json.gz"
          aws s3 cp tests/test-results/vitest/html-report/html.meta.json.gz s3://testreport.staging.ahaslide.com/${REPORTPATH}/vitest/html-report/html.meta.json.gz --content-encoding gzip --content-type application/json

      - name: Extract Test Statistics
        id: extract-stats
        if: always()
        shell: bash
        run: |
          STATS=$(jq -r '"total_tests=\(.numTotalTests // 0)\npassed_tests=\(.numPassedTests // 0)\nfailed_tests=\(.numFailedTests // 0)\nskipped_tests=\(.numPendingTests // 0)"' tests/test-results/vitest/json-report.json)
          echo -e "$STATS" >> $GITHUB_OUTPUT

      - name: Post report to Slack
        if: always()
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_REGRESSION }}
          payload: |
            {
              "text": "🎭 Consumer Test Results",
              "blocks": [
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n${{ inputs.environment || 'staging' }}"
                    },
                    {
                      "type": "mrkdwn", 
                      "text": "*Test Type:*\nConsumer"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Job Status:*\n${{ job.status }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deployer:*\n${{ steps.extract-metadata.outputs.deployer }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*PR:*\n${{ steps.extract-metadata.outputs.pr_link != 'N/A' && format('<{0}|#{1} {2}>', steps.extract-metadata.outputs.pr_link, steps.extract-metadata.outputs.pr_num, steps.extract-metadata.outputs.pr_title) || 'N/A' }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*📊 Test Statistics:*\n• Total: ${{ steps.extract-stats.outputs.total_tests }}\n• ✅ Passed: ${{ steps.extract-stats.outputs.passed_tests }}\n• ❌ Failed: ${{ steps.extract-stats.outputs.failed_tests }}\n• ⏭️ Skipped: ${{ steps.extract-stats.outputs.skipped_tests }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Run on Branch:*\n${{ inputs.branch || github.event.workflow_run.head_branch || github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Triggered By:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "📊 View HTML Report"
                      },
                      "url": "${{ steps.s3-upload.outputs.url }}",
                      "style": "primary"
                    },
                    {
                      "type": "button", 
                      "text": {
                        "type": "plain_text",
                        "text": "📋 View Action Logs"
                      },
                      "url": "https://github.com/AhaSlides-Product/aha-slide-plugin/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
