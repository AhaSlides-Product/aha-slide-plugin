name: "Release SDK tarballs (GitHub Releases)"

# Token-free distribution of the @aha/* SDK for public consumers.
#
# Why: the packages published to GitHub Packages / npmjs require the installer to
# authenticate (GitHub Packages always needs a read token, even for public repos).
# GitHub *Release assets* of a PUBLIC repo, by contrast, are downloadable by anyone
# with NO token and NO env var. So this workflow builds the SDK packages, `npm pack`s
# them, and uploads the resulting .tgz files to a GitHub Release. A consumer then
# points its package.json deps at the asset URLs and runs a plain `npm install` — no
# .npmrc, no GH_TOKEN, no npmjs.
#
# Package set: REQUESTED_PACKAGES below are the app-facing SDK packages
# (@aha/common, @aha/api, @aha/db, @aha/ui). The workflow then automatically adds any
# transitive @aha/* dependency required to install them (today: @aha/ui pulls
# @aha/design + @aha/ui-vanilla) so the release is actually installable — a tarball
# whose package.json says "@aha/design": "*" is broken unless that package is also
# available. The consumer lists ALL of them (requested + transitive) so npm satisfies
# every internal "@aha/*": "*" dep by dedup.
#
# Update path:
#  - Pinned/reproducible: run with a versioned tag (e.g. sdk-v2026.08.18); consumers
#    pin the aha-<pkg>-<version>.tgz URLs and bump when they want the new version.
#  - Always-latest: the moving `sdk-latest` release keeps stable filenames
#    (aha-<pkg>.tgz); consumers reinstall to pull the newest build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish tarballs under (e.g. sdk-latest or sdk-v2026.08.18)"
        required: true
        default: "sdk-latest"
  push:
    # Every push to the default branch refreshes the moving `sdk-latest` release
    # (always-latest flow). A `sdk-v*` tag cuts a pinned/reproducible release.
    branches:
      - staging
    tags:
      - "sdk-v*"

permissions:
  contents: write

jobs:
  release-tarballs:
    runs-on: ubuntu-latest
    env:
      # App-facing SDK packages to publish. Transitive @aha/* deps are added
      # automatically (see "Resolve closure + build").
      REQUESTED_PACKAGES: "@aha/common @aha/api @aha/db @aha/ui"
      # dispatch -> the chosen tag; sdk-v* tag push -> that tag; branch push -> sdk-latest
      RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'sdk-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Submodules (the apps/*) are workspace members, so npm install needs them
          # present. GH_PAT reads the private app submodules in CI (not exposed to
          # consumers). The SDK packages themselves live in this repo, not submodules.
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Resolve closure + build
        shell: bash
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const requested = process.env.REQUESTED_PACKAGES.trim().split(/\s+/);
          const dirFor = (name) => 'packages/' + name.replace('@aha/', '');

          // Walk @aha/* runtime deps so the release is installable (e.g. @aha/ui
          // needs @aha/design + @aha/ui-vanilla at runtime).
          const closure = new Map();
          function add(name) {
            if (closure.has(name)) return;
            const dir = dirFor(name);
            const pkg = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8'));
            closure.set(name, {
              name,
              dir,
              base: name.replace('@aha/', 'aha-'),
              version: pkg.version,
              requested: requested.includes(name),
            });
            const deps = { ...(pkg.dependencies || {}), ...(pkg.peerDependencies || {}) };
            for (const d of Object.keys(deps)) if (d.startsWith('@aha/')) add(d);
          }
          requested.forEach(add);

          const list = [...closure.values()];
          fs.writeFileSync('_closure.json', JSON.stringify(list, null, 2));
          console.log('Requested :', requested.join(', '));
          console.log('Transitive:', list.filter((p) => !p.requested).map((p) => p.name).join(', ') || '(none)');

          const filters = list.map((p) => '--filter=' + p.name).join(' ');
          execSync('npx turbo run build ' + filters, { stdio: 'inherit' });
          SCRIPT

      - name: Pack tarballs + manifest
        shell: bash
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const list = JSON.parse(fs.readFileSync('_closure.json', 'utf8'));
          fs.mkdirSync('_tarballs', { recursive: true });

          const repo = process.env.GITHUB_REPOSITORY || 'AhaSlides-Product/aha-slide-plugin';
          const tag = process.env.RELEASE_TAG;
          const manifest = { repo, tag, packages: {} };

          for (const p of list) {
            // npm pack names the file "<scope>-<name>-<version>.tgz" -> e.g. aha-ui-1.4.0.tgz
            execSync('npm pack --workspace=' + p.name + ' --pack-destination=_tarballs', { stdio: 'inherit' });
            const versionedFile = p.base + '-' + p.version + '.tgz';
            const stableFile = p.base + '.tgz';
            fs.copyFileSync('_tarballs/' + versionedFile, '_tarballs/' + stableFile);

            const baseUrl = 'https://github.com/' + repo + '/releases/download/' + tag + '/';
            manifest.packages[p.name] = {
              version: p.version,
              requested: p.requested,
              versionedFile,
              stableFile,
              versionedUrl: baseUrl + versionedFile,
              stableUrl: baseUrl + stableFile,
            };
          }

          fs.writeFileSync('_tarballs/sdk-manifest.json', JSON.stringify(manifest, null, 2) + '\n');

          // Ready-to-paste consumer deps block (stable URLs) — includes transitive
          // @aha packages so npm can satisfy every internal "@aha/*": "*" by dedup.
          const deps = {};
          for (const [name, info] of Object.entries(manifest.packages)) deps[name] = info.stableUrl;
          fs.writeFileSync('_tarballs/consumer-deps.json', JSON.stringify({ dependencies: deps }, null, 2) + '\n');

          console.log('Packed:', list.map((p) => p.name).join(', '));
          SCRIPT

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists — clobbering assets."
            gh release upload "$RELEASE_TAG" _tarballs/*.tgz _tarballs/sdk-manifest.json _tarballs/consumer-deps.json --clobber
          else
            echo "Creating release $RELEASE_TAG."
            gh release create "$RELEASE_TAG" _tarballs/*.tgz _tarballs/sdk-manifest.json _tarballs/consumer-deps.json \
              --title "SDK tarballs — $RELEASE_TAG" \
              --notes "Token-free @aha/* SDK tarballs for public consumers (GitHub Release assets — no token, no env var, no npmjs). See sdk-manifest.json for versions/URLs and consumer-deps.json for a ready-to-paste package.json deps block."
          fi
