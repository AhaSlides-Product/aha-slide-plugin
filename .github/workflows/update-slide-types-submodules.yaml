name: "Update slide types staging"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on:
      group: github-runner-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
      - name: Update submodules
        uses: ./.github/actions/checkout
        with:
          plugins_branch: staging
          target_branch: staging 
          token: ${{ secrets.GH_PAT }}

