name: 'Deploy Report App'
description: 'Deploys the report application to S3'

inputs:
  s3_bucket:
    description: 'Target S3 Bucket URL (e.g., s3://bucket-name/reports)'
    required: true
  aws_access_key_id:
    description: 'AWS Access Key ID'
    required: true
  aws_secret_access_key:
    description: 'AWS Secret Access Key'
    required: true
  aws_region:
    description: 'AWS Region'
    required: true
  cloudfront_distribution_id:
    description: 'CloudFront Distribution ID to invalidate'
    required: false

runs:
  using: "composite"
  steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: report-build
        path: dist

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}

    - name: Deploy to S3
      shell: bash
      run: |
        set -e
        echo "Deploying to ${{ inputs.s3_bucket }}"
        
        # 1. Sync all files EXCEPT index.html with long cache
        aws s3 cp ./dist "${{ inputs.s3_bucket }}" \
          --metadata-directive REPLACE \
          --cache-control max-age=2160000 \
          --recursive \
          --exclude "index.html"

        # 2. Sync index.html with short cache
        aws s3 cp ./dist/index.html "${{ inputs.s3_bucket }}/index.html" \
          --metadata-directive REPLACE \
          --cache-control "max-age=180, s-maxage=86400"

        # 3. Invalidate CloudFront if ID provided
        if [ -n "${{ inputs.cloudfront_distribution_id }}" ]; then
          echo "Invalidating CloudFront cache for paths: /reports/index.html /reports/*"
          aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.cloudfront_distribution_id }}" \
            --paths "/reports/index.html" "/reports/*"
        fi
