name: 'Deploy App'
description: 'Deploys the application artifacts'
inputs:
  s3_bucket:
    description: 'Target S3 Bucket'
    required: true
  slides_agent_bucket:
    description: 'Target S3 Bucket for slides agents spec'
    required: false
  path_prefix:
    description: 'Optional S3 key + invalidation prefix (e.g. /plugins) to additively serve apps under a sub-path. Must match the build base (VITE_PLUGINS_BASE). Empty = root only (default).'
    required: false
    default: ''
  aws_access_key_id:
    description: 'AWS Access Key ID'
    required: true
  aws_secret_access_key:
    description: 'AWS Secret Access Key'
    required: true
  aws_region:
    description: 'AWS Region'
    required: true
  cloudfront_distribution_id:
    description: 'CloudFront Distribution ID to invalidate'
    required: false
  deploy_storybook:
    description: 'Whether to deploy storybook'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-builds
        path: deployment_artifacts

    - name: Download Storybook Artifacts
      if: ${{ inputs.deploy_storybook == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: storybook-builds
        path: storybook_artifacts

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}

    - name: Deploy to S3
      shell: bash
      env:
        S3_BUCKET: ${{ inputs.s3_bucket }}
        SLIDES_AGENT_BUCKET: ${{ inputs.slides_agent_bucket }}
        PATH_PREFIX: ${{ inputs.path_prefix }}
      run: |
        INVALIDATION_PATHS=""
        MISSING_DIST=0

        # Deploy a single plugin's build output. Path is keyed by leaf folder name
        # so a grouped plugin (apps/<group>/<plugin>/) deploys to s3://bucket/<plugin>/
        # — same shape as a top-level plugin (apps/<plugin>/).
        deploy_plugin() {
          local app_dir="$1"
          local app_name has_agent=0
          app_name=$(basename "$app_dir")

          if [ -d "${app_dir}slides_agent" ]; then
            has_agent=1
            if [ -n "$SLIDES_AGENT_BUCKET" ]; then
              echo "Copying slides agents spec for ${app_name}..."
              aws s3 cp "${app_dir}slides_agent" "s3://${SLIDES_AGENT_BUCKET}/slide_types_schemas/" --recursive
            fi
          fi

          if [ -d "${app_dir}frontend/dist" ]; then
            echo "Deploying ${app_name}..."
            aws s3 sync "${app_dir}frontend/dist" "s3://${S3_BUCKET}" --exclude "*/index.html" --exclude "index.html"
            aws s3 sync "${app_dir}frontend/dist" "s3://${S3_BUCKET}/${app_name}" --exclude "*" --include "*/index.html" --include "index.html"
            INVALIDATION_PATHS="$INVALIDATION_PATHS /${app_name}/*"
            if [ -n "$PATH_PREFIX" ]; then
              aws s3 sync "${app_dir}frontend/dist" "s3://${S3_BUCKET}${PATH_PREFIX}" --exclude "*/index.html" --exclude "index.html"
              aws s3 sync "${app_dir}frontend/dist" "s3://${S3_BUCKET}${PATH_PREFIX}/${app_name}" --exclude "*" --include "*/index.html" --include "index.html"
              INVALIDATION_PATHS="$INVALIDATION_PATHS ${PATH_PREFIX}/*"
            fi
          elif [ "$has_agent" = 1 ]; then
            # A slide-type plugin ships a slides_agent spec, so it must also have a
            # frontend build. Missing dist here means its build silently failed —
            # fail loudly instead of skipping (this is how AHA-46130 shipped nothing
            # for ~2 weeks while every deploy still reported success).
            echo "::error::No frontend/dist for slide plugin '${app_name}' — its build likely failed; refusing to silently skip it."
            MISSING_DIST=1
          fi
        }

        # Loop top-level entries. If a folder contains aha-plugin-group.json,
        # treat it as a group and recurse one level deeper. Skip dot/underscore
        # prefixed names at every depth (matches the scanner rule).
        for app_dir in deployment_artifacts/apps/*/; do
          name=$(basename "$app_dir")
          case "$name" in _*|.*) continue ;; esac

          if [ -f "${app_dir}aha-plugin-group.json" ]; then
            for child_dir in "${app_dir}"*/; do
              [ -d "$child_dir" ] || continue
              child_name=$(basename "$child_dir")
              case "$child_name" in _*|.*) continue ;; esac
              deploy_plugin "$child_dir"
            done
          else
            deploy_plugin "$app_dir"
          fi
        done

        # Deploy Storybook if it exists and input is true
        if [ "${{ inputs.deploy_storybook }}" == "true" ] && [ -d "storybook_artifacts" ]; then
          echo "Deploying Storybook..."
          aws s3 sync "storybook_artifacts" "s3://${{ inputs.s3_bucket }}/storybook"
          INVALIDATION_PATHS="$INVALIDATION_PATHS /storybook/*"
        fi

        # Deploy Toolkit Schema if present
        schema_dir="deployment_artifacts/packages/toolkit/dist/schema"
        if [ -d "$schema_dir" ] && [ -n "$(ls -A "$schema_dir" 2>/dev/null)" ]; then
          echo "Deploying plugin manifest schema..."
          aws s3 sync "$schema_dir" "s3://${{ inputs.s3_bucket }}/schema"
          INVALIDATION_PATHS="$INVALIDATION_PATHS /schema/*"
        fi

        if [ -n "${{ inputs.cloudfront_distribution_id }}" ] && [ -n "$INVALIDATION_PATHS" ]; then
          echo "Invalidating CloudFront cache for paths: $INVALIDATION_PATHS"
          aws cloudfront create-invalidation --distribution-id "${{ inputs.cloudfront_distribution_id }}" --paths $INVALIDATION_PATHS
        fi

        # Deploy the plugins that DID build (above), then fail the job so a broken
        # plugin can't ship nothing under a green check.
        if [ "$MISSING_DIST" = 1 ]; then
          echo "::error::One or more slide plugins had no frontend build to deploy — failing the deploy."
          exit 1
        fi
