name: 'Build Report App'
description: 'Builds the report application'

inputs:
  build_args:
    description: 'Additional arguments for build command'
    required: false
    default: ''
  mode:
    description: 'Build mode (staging, canary, production)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      shell: bash
      run: npm install

    - name: Build Report App
      shell: bash
      run: npm run build:report -- -- --mode=${{ inputs.mode }}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: report-build
        path: domains/report/dist
        if-no-files-found: error
