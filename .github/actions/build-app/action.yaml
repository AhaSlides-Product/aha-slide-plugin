name: 'Build App'
description: 'Builds the application'

inputs:
  repository_url:
    description: "Docker repository URL"
    required: true
  commit_sha:
    description: "Commit SHA for tagging the image"
    required: true
  platform:
    description: "Architecture platform"
    required: false
    default: linux/amd64
  aws_access_key_id:
    description: 'AWS Access Key ID'
    required: true
  aws_secret_access_key:
    description: 'AWS Secret Access Key'
    required: true
  aws_region:
    description: 'AWS Region'
    required: true
  build_storybook:
    description: 'Whether to build storybook'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Dynamic add backend modules
      shell: bash
      run: npm run prebuild -w @aha/backend-main

    - name: Install dependencies
      shell: bash
      run: npm install

    - name: Build
      shell: bash
      run: npm run build -- --continue || true

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-builds
        path: |
          apps/**/frontend/dist
          apps/**/slides_agent
          apps/*/aha-plugin-group.json
          packages/toolkit/dist/schema
        if-no-files-found: warn

    # A plugin's frontend build (`vue-tsc -b && vite build`) can fail while the
    # top-level `npm run build -- --continue || true` above still exits 0, leaving
    # no `frontend/dist`. The deploy step then silently skips that plugin, so a
    # broken build ships nothing while the pipeline stays green (this hid the
    # AHA-46130 idea-board change for ~2 weeks). Fail here instead: every frontend
    # that declares a `build` script must have produced a non-empty dist.
    - name: Verify frontend builds produced output
      shell: bash
      run: |
        missing=()
        while IFS= read -r pkg; do
          dir=$(dirname "$pkg")
          if node -e "const s=require('./$pkg').scripts||{}; process.exit(s.build?0:1)" 2>/dev/null; then
            if [ ! -d "$dir/dist" ] || [ -z "$(ls -A "$dir/dist" 2>/dev/null)" ]; then
              missing+=("$dir")
            fi
          fi
        done < <(find apps -type d -name node_modules -prune -o -type f -path '*/frontend/package.json' -print)

        if [ "${#missing[@]}" -gt 0 ]; then
          echo "::error::Frontend build produced no dist for ${#missing[@]} plugin(s) — their build failed:"
          printf '::error::  - %s\n' "${missing[@]}"
          exit 1
        fi
        echo "✓ All frontend plugins produced a dist."

    - name: Upload Storybook Artifacts
      if: ${{ inputs.build_storybook == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: storybook-builds
        path: packages/storybook/storybook-static
        if-no-files-found: ignore

    - name: Check Backend Build
      id: check-backend
      shell: bash
      run: |
        if [ -f "packages/backend-main/dist/main.js" ]; then
          echo "build_success=true" >> $GITHUB_OUTPUT
        else
          echo "Backend build failed or missing artifacts."
          echo "build_success=false" >> $GITHUB_OUTPUT
        fi

    - name: Configure AWS Credentials
      if: steps.check-backend.outputs.build_success == 'true'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws_access_key_id }}
        aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      if: steps.check-backend.outputs.build_success == 'true'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Check if image tag exists
      if: steps.check-backend.outputs.build_success == 'true'
      id: check-tag
      shell: bash
      run: |
        if docker manifest inspect ${{ inputs.repository_url }}:${{ inputs.commit_sha }} > /dev/null 2>&1; then
          echo "tag_exists=true" >> $GITHUB_OUTPUT
          echo "Image tag ${{ inputs.commit_sha }} already exists. Skipping build."
        else
          echo "tag_exists=false" >> $GITHUB_OUTPUT
          echo "Image tag ${{ inputs.commit_sha }} does not exist. Proceeding with build."
        fi

    - name: Build and Push Docker Image
      if: steps.check-backend.outputs.build_success == 'true' && steps.check-tag.outputs.tag_exists != 'true'
      run: |
        echo "Building image ${{ inputs.repository_url }}:${{ inputs.commit_sha }}..."
        docker build \
          --platform ${{ inputs.platform }} \
          --push \
          -f packages/backend-main/Dockerfile \
          -t ${{ inputs.repository_url }}:${{ inputs.commit_sha }} .
      shell: bash

