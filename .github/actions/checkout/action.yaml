name: 'Pull submodules'
description: 'Pull submodules'
inputs:
  plugins_branch:
    description: 'Branch of plugin submodules to build from'
    required: true
  target_branch:
    description: 'Branch of main repo to push to'
    required: true
  token:
    description: 'GitHub token for authentication'
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout Submodule Branch
      shell: bash
      run: |
        for dir in apps/*; do
          if [ -d "$dir" ] && ([ -f "$dir/.git" ] || [ -d "$dir/.git" ]); then
            echo "Checking out submodule $dir to branch ${{ inputs.plugins_branch }}"
            git -C "$dir" fetch origin
            git -C "$dir" checkout ${{ inputs.plugins_branch }}
            git -C "$dir" pull origin ${{ inputs.plugins_branch }}
          fi
        done

    - name: Configure Git
      shell: bash
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Debug Repo Permissions
      shell: bash
      run: |
        echo "Querying repository permissions for this token..."
        curl -s -H "Authorization: token ${{ inputs.token }}" \
          https://api.github.com/repos/${{ github.repository }} | \
          grep -A 15 '"permissions":' || echo "Could not retrieve permissions (Token might lack Metadata access)"

    - name: Commit Submodule Changes
      shell: bash
      run: |
        git checkout ${{ inputs.target_branch }}
        git add .
        if ! git diff --cached --quiet; then
          git commit -m "Update submodules to ${{ inputs.plugins_branch }} branch"
          git -c http.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ inputs.token }}" | base64 | tr -d '\n')" \
            push https://github.com/${{ github.repository }}.git anything-branch
        else
          echo "No submodule changes to commit"
        fi